apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-simple-app
  namespace: openllmetry-demo
  labels:
    app: ollama-simple-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-simple-app
  template:
    metadata:
      labels:
        app: ollama-simple-app
    spec:
      initContainers:
      # Init container to wait for Ollama to be ready and pull the model
      - name: init-ollama
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for Ollama to be ready..."
          until curl -f http://ollama:11434/api/tags; do
            echo "Ollama not ready yet, waiting..."
            sleep 5
          done
          echo "Ollama is ready!"
          
          echo "Pulling granite3:latest model..."
          curl -X POST http://ollama:11434/api/pull -d '{"name": "granite3:latest"}' || true
          echo "Model pull initiated"
      containers:
      # TraceLoop Sidecar - intercepts traffic and adds tracing
      - name: traceloop-sidecar
        image: traceloop-sidecar:latest
        imagePullPolicy: Never  # For Minikube local images
        ports:
        - name: proxy
          containerPort: 11434
          protocol: TCP
        env:
        - name: OLLAMA_UPSTREAM
          value: "http://ollama:11434"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        - name: OTEL_SERVICE_NAME
          value: "traceloop-sidecar"
        - name: TRACED_SERVICE_NAME
          value: "ollama-simple-app"
        - name: PORT
          value: "11434"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      
      # Main Application - simple Ollama app without tracing code
      - name: ollama-simple-app
        image: ollama-simple-app:latest
        imagePullPolicy: Never  # For Minikube local images
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: OLLAMA_HOST
          value: "http://localhost:11434"  # Points to sidecar
        - name: OLLAMA_MODEL
          value: "granite3:latest"
        - name: PORT
          value: "8080"
        - name: RUN_SAMPLES
          value: "true"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-simple-app
  namespace: openllmetry-demo
  labels:
    app: ollama-simple-app
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: ollama-proxy
    port: 11434
    targetPort: 11434
    protocol: TCP
  selector:
    app: ollama-simple-app

