receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  
  # Add resource attributes
  resource:
    attributes:
      - key: service.namespace
        value: openllmetry-demo
        action: upsert

exporters:
  # Console exporter for debugging
  logging:
    loglevel: info
    sampling_initial: 5
    sampling_thereafter: 200
  
  # OTLP exporter - configure this to send to your backend
  # Examples: Jaeger, Tempo, Honeycomb, etc.
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true
  
  # Uncomment and configure for other backends:
  # jaeger:
  #   endpoint: jaeger:14250
  #   tls:
  #     insecure: true
  
  # zipkin:
  #   endpoint: http://zipkin:9411/api/v2/spans
  
  # prometheus:
  #   endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [logging, otlp]
  
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888

